<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>급해요! - 가까운 화장실 찾기</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#15283b;background:#f3f8fc}body{margin:0}.wrap{max-width:600px;margin:auto;padding:24px 18px}header{background:#0879d8;color:white;padding:24px 18px;border-radius:18px}h1{font-size:32px;margin:0 0 8px}p{line-height:1.6}.button{display:block;box-sizing:border-box;width:100%;text-align:center;border:0;border-radius:13px;background:#0879d8;color:#fff;padding:17px;margin:12px 0;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer}.button.alt{background:white;color:#0879d8;border:2px solid #0879d8}.card{background:white;border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 3px 14px #173c5c12}.small{font-size:13px;color:#52677b}#status{min-height:24px}a{color:#075eae}
</style>
</head>
<body><main class="wrap"><header><h1>🚻 급해요!</h1><div>화장실이 급할 때, 빠르게 찾아보세요.</div></header>
<section class="card"><h2>지금 화장실 찾기</h2><p>현재 위치를 허용하면 주변 공중화장실을 지도에서 검색할 수 있어요.</p><button class="button" id="nearby">📍 내 주변 화장실 찾기</button><p id="status" role="status"></p><a class="button alt" href="https://www.google.com/maps/search/?api=1&query=%EA%B3%B5%EC%A4%91%ED%99%94%EC%9E%A5%EC%8B%A4" target="_blank" rel="noopener">🗺️ 위치 허용 없이 지도 검색</a></section>
<section class="card"><h2>이용 전 확인</h2><p>지도에 표시된 화장실은 운영시간, 개방 여부, 접근 가능 여부가 실제와 다를 수 있어요. 지도에서 최신 정보와 경로를 확인하세요.</p><p class="small">이 첫 버전은 별도 회원가입이나 서버 없이 작동하며, 위치는 지도 검색 링크를 만드는 데에만 사용합니다.</p></section></main>
<script>
document.getElementById('nearby').addEventListener('click',()=>{const status=document.getElementById('status');if(!navigator.geolocation){status.textContent='이 브라우저에서는 위치 기능을 사용할 수 없습니다. 아래 지도 검색을 이용하세요.';return;}status.textContent='위치를 확인하고 있어요. 위치 권한을 허용해 주세요.';navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;status.textContent='위치를 찾았습니다. 지도를 열게요.';const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('공중화장실')+'&center='+latitude+'%2C'+longitude;window.location.href=url;},err=>{status.textContent=err.code===1?'위치 권한이 거부되었습니다. 브라우저 설정에서 허용하거나 아래 지도 검색을 이용하세요.':'위치를 확인하지 못했습니다. 아래 지도 검색을 이용하세요.';},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});});
</script></body></html>
